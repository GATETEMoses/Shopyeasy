services:
  shop:
    build: .
    ports:
      - "${SHOP_PORT:-8000}:8000"
    volumes:
      - orders:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  orders:
